name: Release

# release-please (release-please-config.json) keeps a release PR open on main
# with the next version and CHANGELOG.md, worked out from conventional commit
# messages. Merging that PR tags the release and publishes it on GitHub, and
# then, in this same run:
#
#   build     tests, builds a macOS arm64 binary stamped with the tag's
#             version, and uploads it (plus README and LICENSE) and its
#             sha256 to the release.
#   homebrew  updates the formula in auxesis/homebrew-tap.
#
# These jobs can't be a separate workflow triggered by the tag: GitHub doesn't
# start workflows for events made with the built-in GITHUB_TOKEN.
#
# The build runs on macOS because the camera and power packages use cgo. The
# asset name has no version in it so that
# releases/latest/download/tally-light-darwin-arm64.tar.gz always points at
# the newest release.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

defaults:
  run:
    shell: bash

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  release-please:
    name: Release PR or release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release

  build:
    name: Build and upload
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: macos-latest
    timeout-minutes: 20
    permissions:
      contents: write
    outputs:
      sha256: ${{ steps.package.outputs.sha256 }}
    env:
      # Passed through env, not interpolated into scripts.
      TAG: ${{ needs.release-please.outputs.tag_name }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151 # v4
        with:
          version: 2026.4.0
          install: true
          install_args: go
          cache: true
          cache_key_prefix: mise-v1-macos

      - name: Test
        run: mise run test

      - name: Build
        run: VERSION="$TAG" mise run build

      # Fail by name if the version stamp didn't take, rather than ship a
      # binary that reports "dev".
      - name: Binary reports the tag's version
        run: |
          got=$(./tally-light version)
          if [ "$got" != "tally-light $TAG" ]; then
            echo "::error::binary says '$got', want 'tally-light $TAG'"
            exit 1
          fi
          file tally-light

      - name: Package
        id: package
        run: |
          mkdir dist
          tar -czf dist/tally-light-darwin-arm64.tar.gz tally-light README.md LICENSE.md
          (cd dist && shasum -a 256 tally-light-darwin-arm64.tar.gz > tally-light-darwin-arm64.tar.gz.sha256)
          cat dist/*.sha256
          echo "sha256=$(cut -d' ' -f1 dist/tally-light-darwin-arm64.tar.gz.sha256)" >> "$GITHUB_OUTPUT"

      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber dist/*

  # Writes Formula/tally-light.rb in auxesis/homebrew-tap for the release
  # just published. HOMEBREW_TAP_TOKEN is a fine-grained token with
  # Contents: read and write on that repository only. Prereleases (a hyphen
  # in the tag) are left out, so `brew upgrade` only moves to stable ones.
  homebrew:
    name: Update Homebrew tap
    needs: [release-please, build]
    if: ${{ !contains(needs.release-please.outputs.tag_name, '-') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TAG: ${{ needs.release-please.outputs.tag_name }}
      SHA256: ${{ needs.build.outputs.sha256 }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Token is set
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -z "$HOMEBREW_TAP_TOKEN" ]; then
            echo "::error::secret HOMEBREW_TAP_TOKEN is not set; see the comment on this job"
            exit 1
          fi

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          repository: auxesis/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap

      - name: Write formula
        run: scripts/homebrew-formula "$TAG" "$SHA256" > tap/Formula/tally-light.rb

      - name: Commit and push
        working-directory: tap
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/tally-light.rb
          if git diff --cached --quiet; then
            echo "formula already up to date"
            exit 0
          fi
          git commit -m "tally-light $TAG"
          git push
