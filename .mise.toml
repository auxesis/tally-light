[tools]
go = "1.26.8"
golangci-lint = "2.14.0"

[tasks.test]
description = "Vet and run the unit tests"
run = ["go vet ./...", "go test ./..."]

[tasks.lint]
description = "Lint and format-check with golangci-lint; config in .golangci.yaml"
run = "golangci-lint run ./..."

[tasks.build]
description = "Build ./tally-light; set VERSION to stamp a release version"
env = { CGO_ENABLED = "1" }
run = 'go build -trimpath -ldflags "-s -w -X main.version=${VERSION:-dev}" -o tally-light .'
