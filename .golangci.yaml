version: "2"

linters:
  default: none
  enable:
    - bodyclose
    - errcheck
    - gosec
    - govet
    - ineffassign
    - staticcheck
    - unused
  exclusions:
    presets:
      # Unchecked Close, Flush, fmt.Fprint* and friends.
      - std-error-handling
    rules:
      # Test fixtures and temp files are fine in tests.
      - path: _test\.go
        linters:
          - gosec

formatters:
  enable:
    - gofmt
    - goimports
